# spark-job/manifests/02-minio-spark-secret.yaml
#
# Secrets are namespace-scoped in Kubernetes, so we must duplicate
# the MinIO credentials into spark-job namespace for the Spark pods.
# Both values are identical to the ones in the minio namespace.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-credentials
  namespace: spark-job
  labels:
    app: spark
type: Opaque
data:
  access-key: bWluaW8tYWRtaW4=          # minio-admin
  secret-key: bWluaW8tc2VjcmV0LXBhc3N3b3Jk  # minio-secret-password
