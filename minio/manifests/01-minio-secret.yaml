# minio/manifests/01-minio-secret.yaml
#
# Kubernetes Secret holding MinIO root credentials.
# Values below are base64-encoded:
#   MINIO_ROOT_USER:     minio-admin
#   MINIO_ROOT_PASSWORD: minio-secret-password
#
# Re-generate with:  echo -n "yourvalue" | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: minio
  labels:
    app: minio
type: Opaque
data:
  MINIO_ROOT_USER: bWluaW8tYWRtaW4=
  MINIO_ROOT_PASSWORD: bWluaW8tc2VjcmV0LXBhc3N3b3Jk
