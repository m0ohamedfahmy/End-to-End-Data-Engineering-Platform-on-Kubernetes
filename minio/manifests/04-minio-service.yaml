# minio/manifests/04-minio-service.yaml
---
# ClusterIP service for the S3 API used by Spark's S3A connector.
# Spark driver + executors connect to:
#   http://minio-service.minio.svc.cluster.local:9000
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: minio
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30900
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
# NodePort service so you can reach the MinIO web console from your laptop.
# After `kubectl port-forward svc/minio-console -n minio 9001:9001`
# open http://localhost:9001   login: minio-admin / minio-secret-password
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: minio
  labels:
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
      protocol: TCP
